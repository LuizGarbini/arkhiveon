
[functions.r2-upload]
enabled = true
verify_jwt = true
import_map = "./functions/r2-upload/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/r2-upload/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/r2-upload/*.html" ]

[functions.r2-fetch]
enabled = true
verify_jwt = true
import_map = "./functions/r2-fetch/deno.json"
entrypoint = "./functions/r2-fetch/index.ts"

[functions.ia-mesa-chat]
enabled = true
verify_jwt = true
import_map = "./functions/ia-mesa-chat/deno.json"
entrypoint = "./functions/ia-mesa-chat/index.ts"

[functions.library-r2]
enabled = true
verify_jwt = true
import_map = "./functions/library-r2/deno.json"
entrypoint = "./functions/library-r2/index.ts"

[functions.r2-delete]
enabled = true
verify_jwt = true
import_map = "./functions/r2-delete/deno.json"
entrypoint = "./functions/r2-delete/index.ts"

[functions.image-r2]
enabled = true
verify_jwt = true
import_map = "./functions/image-r2/deno.json"
entrypoint = "./functions/image-r2/index.ts"

[functions.stripe-checkout]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-checkout/index.ts"

# O Stripe chama o webhook sem login do Supabase: com verify_jwt = true o
# gateway recusa todo evento. A origem é garantida pela assinatura do webhook,
# conferida dentro da função antes de qualquer gravação.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"
